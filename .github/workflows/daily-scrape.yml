name: Daily AI News Digest

on:
  schedule:
    # Run at 02:15 UTC every day
    - cron: "15 2 * * *"
  workflow_dispatch:         # allow manual trigger

permissions:
  contents: write            # needed to push new _posts/ files
  actions: write              # needed to trigger the Pages deploy workflow
  models: read

jobs:
  scrape-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/scrape.py

      - name: Commit and push new post
        id: commit
        run: |
          git config user.name  "zeroslop-bot"
          git config user.email "bot@zeroslop.net"
          git add _posts/ scripts/seen_urls.json
          if git diff --cached --quiet; then
            echo "Nothing new to commit today."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily digest $(date -u +%Y-%m-%d)"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with the default GITHUB_TOKEN do not trigger other
      # workflows' `on: push` events (GitHub's loop-prevention rule), so
      # pages-deploy.yml would otherwise never see today's commit. Kick it
      # off explicitly instead.
      - name: Trigger Pages deploy
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages-deploy.yml --ref "${{ github.ref_name }}"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/issues \
            --method POST \
            -f title="⚠️ Daily scrape failed — $(date -u +%Y-%m-%d)" \
            -f body="The daily scrape workflow failed. [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            -f 'labels[]=bug' || true
